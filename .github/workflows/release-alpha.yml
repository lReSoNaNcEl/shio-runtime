name: Release Windows Alpha

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*-alpha.*"

concurrency:
  group: alpha-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  api-validation:
    name: API validation
    runs-on: windows-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.lock.txt
      - name: Install locked API development dependencies
        run: python -m pip install -r requirements-dev.lock.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: API tests
        run: python -m pytest tests

  windows-bundle:
    name: Windows alpha bundle
    runs-on: windows-latest
    needs: api-validation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Use npm 11
        run: npm install --global npm@11.6.1
      - name: Install Desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Verify release versions
        run: npm run alpha:version:check
      - name: Desktop checks
        run: |
          npm run desktop:check
          npm run desktop:format:check
          npm run desktop:imports:check
          npm run typecheck
      - name: Launcher validation
        run: npm run alpha:launcher:check
      - name: Build complete alpha bundle
        run: npm run alpha:bundle
      - name: Verify extracted alpha bundle
        run: npm run alpha:bundle:verify
      - name: Generate checksums
        run: npm run alpha:checksums
      - uses: actions/upload-artifact@v4
        with:
          name: shio-runtime-alpha-bundle
          path: |
            release/Shio-Runtime-*-win-x64.zip
            release/Shio-Runtime-*-win-x64.zip.sha256
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 10

  prerelease:
    name: Publish GitHub prerelease
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    needs: windows-bundle
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Verify tag and release versions
        run: npm run alpha:version:check
      - uses: actions/download-artifact@v4
        with:
          name: shio-runtime-alpha-bundle
          path: release-assets
      - name: Create or update prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $title = "Shio Runtime v$version"
          $assets = Get-ChildItem release-assets -File | ForEach-Object FullName
          if (gh release view "${{ github.ref_name }}" 2>$null) {
            gh release edit "${{ github.ref_name }}" --title $title --prerelease --notes-file docs/RELEASE-NOTES-ALPHA.md
            gh release upload "${{ github.ref_name }}" $assets --clobber
          } else {
            gh release create "${{ github.ref_name }}" $assets --title $title --prerelease --notes-file docs/RELEASE-NOTES-ALPHA.md
          }
