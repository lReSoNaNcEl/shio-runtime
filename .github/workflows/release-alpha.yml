name: Release Windows Alpha

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*-alpha.*"

concurrency:
  group: alpha-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  api-validation:
    name: API validation
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-ci.lock.txt
      - name: Install locked API development dependencies
        run: python -m pip install -r requirements-ci.lock.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: API tests
        run: python -m pytest tests

  windows-bundle:
    name: Windows alpha bundle
    runs-on: windows-latest
    timeout-minutes: 60
    needs: api-validation
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify tag ancestry
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-alpha-tag.ps1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Use npm 11
        run: npm install --global npm@11.6.1
      - name: Install Desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Verify release versions
        run: npm run alpha:version:check
      - name: Desktop checks
        run: |
          npm run desktop:check
          npm run desktop:format:check
          npm run desktop:imports:check
          npm run typecheck
      - name: Launcher validation
        run: |
          npm run alpha:launcher:check
          npm run alpha:integrity:check
      - name: Build complete alpha bundle
        run: npm run alpha:bundle
      - name: Verify extracted alpha bundle
        run: npm run alpha:bundle:verify
      - name: Generate checksums
        run: npm run alpha:checksums
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shio-runtime-alpha-bundle
          path: |
            release/Shio-Runtime-*-win-x64.zip
            release/Shio-Runtime-*-win-x64.zip.sha256
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 10

  prerelease:
    name: Publish GitHub prerelease
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 15
    needs: windows-bundle
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify tag ancestry
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-alpha-tag.ps1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Verify tag and release versions
        run: npm run alpha:version:check
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shio-runtime-alpha-bundle
          path: release-assets
      - name: Create and publish immutable prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          ./scripts/publish-alpha-release.ps1
          -Tag "${{ github.ref_name }}"
          -AssetsDirectory release-assets
          -NotesFile docs/RELEASE-NOTES-ALPHA.md
